workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never
    
stages:
  - build
  - package
  - deploy

build:
  stage: build
  tags:
    - docker
  image: registry.gitlab.com/getinsight.it/arquitetura/docker-base-images/builder/builder-java:21
  script:
    - mvn clean package -P sentry -T $(nproc) -Dmaven.artifact.threads=$(nproc) -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -s maven-settings.xml
  cache:
    when: on_success
    paths:
      - $CI_PROJECT_DIR/.m2/repository
  artifacts:
    when: on_success
    paths:
      - target/

package:
  stage: package
  tags:
    - docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build --no-cache --pull -t ${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID} .
    - docker push ${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID}


.deploy:
  variables:
    IMAGE_TAG: ${CI_REGISTRY_IMAGE}:${CI_PIPELINE_ID}
  stage: deploy
  tags:
    - docker
  image: registry.gitlab.com/getinsight.it/arquitetura/docker-base-images/kubernetes-manage:1.0.0
  before_script:
    - mkdir ~/.kube || true
    - echo $KUBE_CONFIG | base64 --decode > ~/.kube/config
  script:
    - envsubst < ./k8s/deployment.yaml | kubectl apply -f -

deploy-dev:
  variables:
    KUBE_CONFIG: ${KUBE_CONFIG_NONPROD}
  extends: .deploy
  environment: dev

deploy-prd:
  variables:
    KUBE_CONFIG: ${KUBE_CONFIG_PROD}
  extends: .deploy
  environment: prd
  when: manual

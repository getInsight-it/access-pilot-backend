<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Status da solicitação de acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Mulish";
        }

        img {
            width: 200px;
        }

        h1 {
            font-size: 1.5em;
        }
        .ap-container {
            padding: 20px;
        }
        ul {
            list-style: none;
            padding-left: 0px;

        }
        ul li {
            margin-top: 10px;

        }
        .detalhes {
            background: black;
            color: white;
            max-width: 720px;
            width: 100%;
            padding: 10px 20px;
        }
        .titulo {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        img.key-icon {
            width: 24px;
            height: 24px;
            margin-left: 10px;
        }
    </style>

</head>
<body>
<div class="ap-container">
    <img th:if="${link != null}" th:src="${link.frontendUrl + '/img/accesspilot.svg'}" />
    <div class="titulo">
        <h1>
            Status da solicitação de acesso
        </h1>
    </div>
    <div class="">
        <p>
            Olá,
            <br />
            Você recebeu uma atualização no status da solicitação de acesso.
        </p>
        <p>Detalhes:</p>
    </div>
    <div class="detalhes">
        <ul>
            <li th:if="${request != null}">
                <strong>Protocolo:</strong>
                <span th:text="${request.protocolCode}"></span>
            </li>
            <li th:if="${approvingUser != null}">
                <strong>Nome do aprovador:</strong>
                <span th:text="${approvingUser.username}"></span>
            </li>
            <li th:if="${requestingUser != null}">
                <strong>Nome do solicitante:</strong>
                <span th:text="${requestingUser.username}"></span>
            </li>
            <li>
                <strong>Perfil:</strong>
                <span th:if="${role != null}" th:text="${role.name}"></span>
            </li>
            <li>
                <strong>Sistema:</strong>
                <span th:if="${client != null}" th:text="${client.clientId}"></span>
            </li>
            <li th:if="${level != null && level.name != null}">
                <strong>Esfera:</strong>
                <span th:text="${level.name}"></span>
            </li>
            <li th:if="${item != null && item.name != null}">
                <strong>Item da esfera:</strong>
                <span th:text="${item.name}"></span>
            </li>
            <li>
                <strong>Status:</strong>
                <span th:text="${status}"></span>
            </li>
        </ul>

    </div>
    <p>
        Obrigado,
    </p>
    <p>Accesspilot</p>
</div>
</body>
</html>

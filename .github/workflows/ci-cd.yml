name: ci-cd.yml
on:
  push:
    branches:
      - develop

jobs:

  build:
    name: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: mvn-build
        id: mvn-build
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mvn -B clean package -P sentry -T $(nproc) -Dmaven.artifact.threads=$(nproc) -s maven-settings-gh.xml

      - uses: actions/upload-artifact@v5
        with:
          path: target/*.jar
          retention-days: 1
          if-no-files-found: 'error'
          include-hidden-files: 'true'
          name: 'target'


  container:
    name: container
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6

      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: token
          password: ${{ secrets.GITLAB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-image
        env:
          DOCKER_TAG: ghcr.io/${{ github.repository }}:latest
        run: |
          cd
          docker buildx create --use --driver docker-container --bootstrap
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile -t "$DOCKER_TAG" --push .


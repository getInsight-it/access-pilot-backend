name: ci-cd.yml
on:
  push:
    branches:
      - develop

jobs:

  build:
    name: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: mvn-build
        id: mvn-build
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mvn -B clean package -P sentry -T $(nproc) -Dmaven.artifact.threads=$(nproc) -s maven-settings-gh.xml

      - uses: actions/upload-artifact@v5
        with:
          path: target/
          retention-days: 1
          if-no-files-found: 'error'
          include-hidden-files: 'true'
          name: 'target'

  sonar:
    name: sonar
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/target

      - uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.java.binaries=${{ github.workspace }}/target/classes
            -Dsonar.java.source=21
            -Dsonar.projectName=accesspilot-backend
            -Dsonar.projectKey=accesspilot-backend
            -Dsonar.verbose=true
            -Dsonar.sources=${{ github.workspace }}/src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  release:
    name: release
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag_name: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/target

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.github_token }}
          git-user-email: 'accesspilot@getinsight.it'
          output-file: "false"

      - name: zip
        run: |
          zip -9 ${{ github.workspace }}/accesspilot-backend-${{ steps.changelog.outputs.version }} ${{ github.workspace }}/target/*.jar

      - uses: actions/create-release@v1
        id: create_release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}-${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false

      - uses: actions/upload-release-asset@v1
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ${{ github.workspace }}/accesspilot-backend-${{ steps.changelog.outputs.version }}.zip
          asset_name: accesspilot-backend-${{ steps.changelog.outputs.version }}.zip
          asset_content_type: application/zip

  container:
    name: container
    environment: dev
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/target

      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: token
          password: ${{ secrets.GITLAB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-image
        env:
          TAG: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          LATEST: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker buildx create --use --driver docker-container --bootstrap
          export DOCKER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          export LATEST_TAG=$(echo "$LATEST" | tr '[:upper:]' '[:lower:]')
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64 -f Dockerfile -t "$DOCKER_TAG" -t "$LATEST_TAG" --push .


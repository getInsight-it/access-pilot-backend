name: ci-cd.yml
on:
  push:
    branches:
      - develop

jobs:

  build:
    name: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: mvn-build
        id: mvn-build
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mvn -B clean package -P sentry -T $(nproc) -Dmaven.artifact.threads=$(nproc) -s maven-settings-gh.xml

      - uses: actions/upload-artifact@v5
        with:
          path: target/*.jar
          retention-days: 1
          if-no-files-found: 'error'
          include-hidden-files: 'true'
          name: 'target'

  release:
    name: release
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/target

      - name: zip
        run: |
          zip -9 accesspilot-backend-${{ github.ref }} ${{ github.workspace }}/target/*.jar

      - uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: true

      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./accesspilot-backend-${{ github.ref }}.zip
          asset_name: accesspilot-backend-${{ github.ref }}.zip
          asset_content_type: application/zip

  container:
    name: container
    environment: dev
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          path: ${{ github.workspace }}/target

      - uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: token
          password: ${{ secrets.GITLAB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-image
        env:
          TAG: ghcr.io/${{ github.repository }}:latest
        run: |
          docker buildx create --use --driver docker-container --bootstrap
          export DOCKER_TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64 -f Dockerfile -t "$DOCKER_TAG" --push .

